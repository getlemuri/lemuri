settings.probe=Check whether hosts answer
settings.probe.every1=Every minute
settings.probe.every5=Every 5 minutes
settings.probe.never=Never (only with Refresh)
settings.probe.note=A TCP connection to each host''s SSH port, without logging in. Each one leaves a line in the server''s sshd log: every 5 minutes is about 290 lines a day per host, every minute about 1,440.
settings.terminal=Terminal
settings.typesCommands=Interactive mode: let Lemuri type commands into the terminal
settings.typesCommands.note=Double click on a folder listed by ls: cd and ls; on a text file: nano (binary files and those over 1 MB are not opened); on the empty space at the prompt: ls. Uploads go into the terminal''s folder. You see every command, as if you typed it, and only at an empty prompt. When off, uploads go to the home folder.

