name: Servers of other distributions

# Lemuri against SSH servers of Debian, Ubuntu, Fedora, Rocky, Arch, Alpine and openSUSE in containers
# (src/test/distros/run.sh). Slower than the build: weekly and by hand, not on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  distros:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: SSH servers in containers
        run: bash src/test/distros/run.sh
