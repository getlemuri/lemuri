name: Servers of other distributions

# Lemuri against SSH servers of Debian, Ubuntu, Fedora, Rocky, Arch, Alpine and openSUSE in containers
# (src/test/distros/run.sh). Slower than the build: weekly and by hand, not on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  distros:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: SSH servers in containers
        run: bash src/test/distros/run.sh
